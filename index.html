<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO Online</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Main Friends List Card -->
  <div class="w-full max-w-md bg-slate-900 text-white rounded-xl p-5 shadow-2xl border border-slate-800">
    
    <!-- App Header -->
    <div class="flex items-center justify-between mb-5 border-b border-slate-800 pb-3">
      <h1 class="text-xl font-black tracking-wider text-red-500 uppercase flex items-center gap-2">
        <i data-lucide="gamepad-2" class="w-6 h-6"></i> UNO Online
      </h1>
      <span class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-400 border border-slate-700">
        Friends (3)
      </span>
    </div>

    <!-- Friends List Container -->
    <div id="friends-list" class="space-y-3">
      <!-- Friends rendered dynamically via JS -->
    </div>
  </div>

  <!-- Profile Modal (Hidden by Default) -->
  <div id="profile-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 relative text-center shadow-2xl">
      
      <!-- Close Button -->
      <button id="close-modal-btn" class="absolute top-4 right-4 text-slate-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- Profile Header -->
      <img id="modal-avatar" src="" alt="Avatar" class="w-20 h-20 mx-auto rounded-full bg-slate-800 border-2 border-red-500 mb-3" />
      <h3 id="modal-username" class="text-xl font-extrabold text-white">---</h3>
      <div id="modal-status-badge" class="mt-2 inline-block"></div>

      <!-- Player Statistics -->
      <div class="grid grid-cols-3 gap-2 bg-slate-800/80 border border-slate-700/50 p-3 rounded-xl my-5 text-center">
        <div>
          <p class="text-xs text-slate-400 mb-1">Wins</p>
          <p id="modal-wins" class="font-black text-green-400 text-lg">0</p>
        </div>
        <div>
          <p class="text-xs text-slate-400 mb-1">Played</p>
          <p id="modal-played" class="font-black text-slate-200 text-lg">0</p>
        </div>
        <div>
          <p class="text-xs text-slate-400 mb-1">Win %</p>
          <p id="modal-winrate" class="font-black text-yellow-400 text-lg">0%</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div id="modal-actions" class="space-y-2">
        <!-- Dynamically injected based on status -->
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    // Sample Friends Data
    const friends = [
      {
        id: 'u101',
        name: 'CardShark99',
        avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=CardShark99',
        status: 'IN_GAME',
        gameDetails: { mode: 'Classic 4P', roomCode: 'X7K2' },
        stats: { wins: 142, totalPlayed: 230, winRate: '61%' }
      },
      {
        id: 'u102',
        name: 'WildCardMaster',
        avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=WildCardMaster',
        status: 'ONLINE',
        gameDetails: null,
        stats: { wins: 89, totalPlayed: 150, winRate: '59%' }
      },
      {
        id: 'u103',
        name: 'SkipGuru',
        avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=SkipGuru',
        status: 'OFFLINE',
        gameDetails: null,
        stats: { wins: 12, totalPlayed: 45, winRate: '26%' }
      }
    ];

    // Helper: Generate Status Badge HTML
    function getStatusBadgeHTML(status) {
      switch (status) {
        case 'IN_GAME':
          return `<span class="text-xs bg-purple-500/20 text-purple-400 border border-purple-500/40 px-2.5 py-1 rounded-full font-bold">In Match</span>`;
        case 'ONLINE':
          return `<span class="text-xs bg-green-500/20 text-green-400 border border-green-500/40 px-2.5 py-1 rounded-full font-bold">Online</span>`;
        default:
          return `<span class="text-xs bg-gray-500/20 text-gray-400 border border-gray-500/40 px-2.5 py-1 rounded-full font-bold">Offline</span>`;
      }
    }

    // Helper: Get Indicator Color Dot
    function getStatusDotClass(status) {
      switch (status) {
        case 'IN_GAME': return 'bg-purple-500';
        case 'ONLINE': return 'bg-green-500';
        default: return 'bg-gray-500';
      }
    }

    // Render Friends List
    function renderFriendsList() {
      const container = document.getElementById('friends-list');
      container.innerHTML = '';

      friends.forEach(friend => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-slate-800 hover:bg-slate-750 p-3 rounded-xl border border-slate-700/60 cursor-pointer transition';
        
        item.onclick = () => openProfileModal(friend);

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="relative">
              <img src="${friend.avatar}" alt="${friend.name}" class="w-11 h-11 rounded-full bg-slate-700" />
              <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-slate-900 ${getStatusDotClass(friend.status)}"></span>
            </div>
            <div>
              <p class="font-bold text-sm text-slate-100">${friend.name}</p>
              <p class="text-xs text-slate-400">
                ${friend.status === 'IN_GAME' ? `Playing: ${friend.gameDetails.mode}` : friend.status}
              </p>
            </div>
          </div>
          <div>${getStatusBadgeHTML(friend.status)}</div>
        `;

        container.appendChild(item);
      });
    }

    // Open Profile Modal with Selected Friend Data
    function openProfileModal(friend) {
      document.getElementById('modal-avatar').src = friend.avatar;
      document.getElementById('modal-username').innerText = friend.name;
      document.getElementById('modal-status-badge').innerHTML = getStatusBadgeHTML(friend.status);
      document.getElementById('modal-wins').innerText = friend.stats.wins;
      document.getElementById('modal-played').innerText = friend.stats.totalPlayed;
      document.getElementById('modal-winrate').innerText = friend.stats.winRate;

      const actionsContainer = document.getElementById('modal-actions');
      actionsContainer.innerHTML = '';

      if (friend.status === 'IN_GAME') {
        actionsContainer.innerHTML = `
          <button class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 transition">
            <i data-lucide="eye" class="w-4 h-4"></i> Spectate Match
          </button>
        `;
      } else if (friend.status === 'ONLINE') {
        actionsContainer.innerHTML = `
          <button class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 transition">
            <i data-lucide="play" class="w-4 h-4"></i> Invite to Match
          </button>
        `;
      } else {
        actionsContainer.innerHTML = `
          <p class="text-xs text-slate-500 italic py-2">User is currently offline</p>
        `;
      }

      document.getElementById('profile-modal').classList.remove('hidden');
      document.getElementById('profile-modal').classList.add('flex');

      // Re-initialize dynamic icons inside modal
      lucide.createIcons();
    }

    // Close Modal Handler
    document.getElementById('close-modal-btn').onclick = () => {
      document.getElementById('profile-modal').classList.add('hidden');
      document.getElementById('profile-modal').classList.remove('flex');
    };

    // Initial render and Icon initialize
    renderFriendsList();
    lucide.createIcons();
  </script>
</body>
</html>
